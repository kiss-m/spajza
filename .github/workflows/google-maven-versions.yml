name: Google Maven versions

# Prints the latest stable versions of Google Maven artifacts as annotations, because the dev
# container cannot reach dl.google.com.
on:
  push:
    branches: ['m1/**']
    paths: ['.github/workflows/google-maven-versions.yml']
  workflow_dispatch:

jobs:
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Latest stable versions
        run: |
          for a in \
            com/android/tools/build/gradle \
            androidx/compose/compose-bom \
            com/google/firebase/firebase-bom \
            com/google/gms/google-services \
            com/google/android/libraries/identity/googleid/googleid \
            androidx/core/core-ktx \
            androidx/core/core-splashscreen \
            androidx/appcompat/appcompat \
            androidx/activity/activity-compose \
            androidx/lifecycle/lifecycle-runtime-compose \
            androidx/navigation/navigation-compose \
            androidx/room3/room3-runtime \
            androidx/sqlite/sqlite-bundled \
            androidx/datastore/datastore-preferences \
            androidx/work/work-runtime-ktx \
            androidx/credentials/credentials \
            androidx/credentials/credentials-play-services-auth \
            androidx/hilt/hilt-navigation-compose \
            androidx/hilt/hilt-lifecycle-viewmodel-compose \
            androidx/compose/material3/material3 \
            androidx/compose/material/material-icons-core \
            androidx/compose/ui/ui \
            androidx/test/core \
            androidx/test/ext/junit \
            com/google/firebase/firebase-auth \
            com/google/firebase/firebase-firestore; do
            v=$(curl -fsSL "https://dl.google.com/dl/android/maven2/$a/maven-metadata.xml" \
              | grep -oE '<version>[^<]+' | sed 's/<version>//' \
              | grep -viE 'alpha|beta|rc|dev|eap|snapshot' | sort -V | tail -1 || true)
            echo "::notice title=$a::${v:-not found}"
          done
          echo "::notice title=sdk platforms::$(ls "$ANDROID_HOME/platforms" | tr '\n' ' ')"
          echo "::notice title=sdk build-tools::$(ls "$ANDROID_HOME/build-tools" | tr '\n' ' ')"
